<body onload="main()" onresize="resize()" onkeydown="keyController()">
<template-list>
<template id="type-a">
<svg id="icon" data-name="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 8000 8000">
<g>
</g>
<g transform-origin="4000 4000 0">
</g>
</svg>
</template>
<template id="type-b">
<svg id="icon" data-name="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 8000 8000">
<defs>
<linearGradient id="figure-fill">
</linearGradient>
</defs>
<g>
</g>
<g transform-origin="4000 4000 0" fill="url('#figure-fill')">
</g>
</svg>
</template>
<template id="type-c">
<svg id="icon" data-name="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 8000 8000">
<defs>
<linearGradient id="background-fill">
</linearGradient>
</defs>
<g>
</g>
<g transform-origin="4000 4000 0">
</g>
</svg>
</template>
<template id="type-d">
<svg id="icon" data-name="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 8000 8000">
<defs>
<linearGradient id="background-fill">
</linearGradient>
<linear-gradient id="figure-fill">
</linear-gradient>
</defs>
<g>
</g>
<g transform-origin="4000 4000 0" fill="url('#figure-fill')">
</g>
</svg>
</template>
<template id="type-e">
<svg id="icon" data-name="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 8000 8000">
<defs>
<pattern id="background-fill" x="0" y="0" width="8000" height="8000" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse" preserveAspectRatio="xMidYMid meet">
<image xlink:href="" x="0" y="0" width="8000" height="8000">
</image>
</pattern>
</defs>
<g>
</g>
<g transform-origin="4000 4000 0">
</g>
</svg>
</template>
<template id="type-f">
<svg id="icon" data-name="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 8000 8000">
<defs>
<pattern id="background-fill" x="0" y="0" width="8000" height="8000" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse" preserveAspectRatio="xMidYMid meet">
<image xlink:href="" x="0" y="0" width="8000" height="8000">
</image>
</pattern>
<linear-gradient id="figure-fill">
</linear-gradient>
</defs>
<g>
</g>
<g transform-origin="4000 4000 0" fill="url('#figure-fill')">
</g>
</svg>
</template>
</template-list>

</embed>
</dialog>
</div>
